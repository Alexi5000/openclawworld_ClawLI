name: Secret Scan

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/gitleaks_${version}_checksums.txt"
          grep "  $archive\$" "gitleaks_${version}_checksums.txt" > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose
