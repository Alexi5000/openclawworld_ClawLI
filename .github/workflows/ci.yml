name: Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Smoke test, server checks, lint, builds, and CLI package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm --prefix server ci --no-audit --no-fund

      - name: Install client dependencies
        run: npm --prefix client ci --no-audit --no-fund

      - name: Install landing-page dependencies
        run: npm --prefix landing-page ci --no-audit --no-fund

      - name: Run repository smoke suite
        run: npm run test

      - name: Validate server modules
        run: npm run check:server

      - name: Lint landing page
        run: npm run lint:landing

      - name: Build world client
        run: npm run build:client

      - name: Build landing page
        run: npm run build:landing

      - name: Verify CLI package
        run: npm run pack:cli
